<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>واجهة الشيخخخ - مشغل كلاسيكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* ==================== الإعدادات الأساسية ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0a0a0a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 30%, #202020 0%, #050505 80%);
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            background: #0f0f0f;
        }

        /* ==================== الشاشة الأولى (الترحيب) ==================== */
        .welcome-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            background: linear-gradient(135deg, #111, #000);
            transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.8s ease;
        }

        .welcome-screen.hide {
            transform: translateY(-100%);
            opacity: 0;
        }

        .welcome-subtitle {
            color: #d4af37;
            font-size: 20px;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .welcome-title {
            font-size: 38px;
            text-align: center;
            font-weight: 900;
            margin-bottom: 40px;
            text-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        .enter-btn {
            background: transparent;
            border: 2px solid #d4af37;
            color: #d4af37;
            padding: 12px 60px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        }

        .enter-btn:hover {
            background: #d4af37;
            color: #000;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
        }

        /* ==================== الشاشة الثانية (المشغل والأسماء) ==================== */
        .player-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            background: url('https://www.transparenttextures.com/patterns/cubes.png'), #141414;
            z-index: 5;
        }

        /* ----- قسم المشغل الكلاسيكي (Turntable) ----- */
        .turntable-container {
            width: 100%;
            height: 350px;
            background: #1a1a1a;
            border-bottom: 2px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.5);
            padding-top: 20px;
        }

        /* قاعدة المشغل */
        .turntable-base {
            width: 280px;
            height: 280px;
            background: #222;
            border-radius: 20px;
            position: relative;
            box-shadow: 
                0 15px 25px rgba(0,0,0,0.8),
                inset 0 2px 5px rgba(255,255,255,0.1),
                inset 0 -2px 5px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* الأسطوانة (الڤاينل) */
        .vinyl-record {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: 
                repeating-radial-gradient(
                    #111 0, 
                    #111 3px, 
                    #1a1a1a 4px, 
                    #111 5px
                );
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spin 3s linear infinite;
            animation-play-state: paused; /* تتوقف افتراضياً */
        }

        /* لمعان الإضاءة الواقعية على الأسطوانة */
        .vinyl-record::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                from 45deg,
                rgba(255, 255, 255, 0) 0deg,
                rgba(255, 255, 255, 0.15) 30deg,
                rgba(255, 255, 255, 0) 60deg,
                rgba(255, 255, 255, 0) 180deg,
                rgba(255, 255, 255, 0.15) 210deg,
                rgba(255, 255, 255, 0) 240deg
            );
            pointer-events: none;
        }

        /* ملصق الأسطوانة في المنتصف */
        .vinyl-label {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #8b0000, #4a0000); /* لون كلاسيكي */
            border-radius: 50%;
            border: 2px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: #d4af37;
            text-align: center;
            z-index: 2;
        }
        
        .vinyl-hole {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #000;
            border-radius: 50%;
            border: 2px solid #333;
            z-index: 3;
        }

        /* عصا المشغل (Tonearm) */
        .tonearm {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 180px;
            transform-origin: 20px 20px; /* نقطة الدوران من الأعلى */
            transform: rotate(-35deg); /* وضع التوقف الافتراضي */
            transition: transform 0.5s ease-in-out;
            z-index: 10;
        }

        /* عندما تشتغل الأغنية، تتحرك العصا فوق الأسطوانة */
        .tonearm.playing {
            transform: rotate(18deg);
        }

        /* قاعدة العصا (المحور) */
        .tonearm-base {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #e0e0e0 0%, #888 70%, #444 100%);
            border-radius: 50%;
            position: absolute;
            top: 0; left: 0;
            box-shadow: 0 5px 10px rgba(0,0,0,0.6);
            border: 2px solid #555;
        }

        /* عمود العصا المعدني */
        .tonearm-stick {
            width: 8px;
            height: 140px;
            background: linear-gradient(to right, #999, #fff, #777);
            position: absolute;
            top: 20px;
            left: 16px;
            border-radius: 4px;
            box-shadow: 5px 5px 10px rgba(0,0,0,0.5);
        }

        /* إبرة العصا (Head) */
        .tonearm-head {
            width: 16px;
            height: 35px;
            background: #111;
            position: absolute;
            bottom: -5px;
            left: 12px;
            border-radius: 4px;
            border-top: 2px solid #d4af37;
            transform: rotate(20deg); /* زاوية الإبرة */
            box-shadow: 2px 5px 5px rgba(0,0,0,0.5);
        }

        /* زر التشغيل والإيقاف (تحت الأسطوانة) */
        .controls {
            position: absolute;
            bottom: -25px; /* يبرز للأسفل قليلاً */
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }

        .play-btn {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            border: 4px solid #1a1a1a;
            border-radius: 50%;
            color: #000;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            transition: 0.2s;
        }
        .play-btn:hover {
            transform: scale(1.1);
        }

        /* ----- قسم نافذة الأسماء ----- */
        .names-window {
            flex: 1;
            padding: 45px 20px 20px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px); /* تأثير الزجاج */
        }

        .name-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 15px 20px;
            margin-bottom: 12px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }
        .name-card:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: #d4af37;
            transform: translateX(-5px);
        }

        .card-icon {
            margin-left: 15px;
            background: #222;
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #444;
            font-size: 18px;
        }

        .vip-name {
            background: linear-gradient(135deg, #2a2000, #141000);
            border: 1px solid #d4af37;
            text-align: center;
            justify-content: center;
            font-size: 22px;
            color: #d4af37;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        /* إخفاء شريط التمرير */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- الشاشة الأولى: الترحيب -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-subtitle">الشيخخخ</div>
            <div class="welcome-title">أسلم عبد الأمير<br>المحمدي</div>
            <button class="enter-btn" id="enterBtn">دخول</button>
        </div>

        <!-- الشاشة الثانية: المشغل والقائمة -->
        <div class="player-screen">
            
            <!-- قسم المشغل الكلاسيكي -->
            <div class="turntable-container">
                <div class="turntable-base">
                    <!-- الأسطوانة -->
                    <div class="vinyl-record" id="vinyl">
                        <div class="vinyl-label">الشيخخخ</div>
                        <div class="vinyl-hole"></div>
                    </div>
                    
                    <!-- عصا المشغل -->
                    <div class="tonearm" id="tonearm">
                        <div class="tonearm-stick"></div>
                        <div class="tonearm-head"></div>
                        <div class="tonearm-base"></div>
                    </div>
                </div>

                <!-- زر التشغيل -->
                <div class="controls">
                    <div class="play-btn" id="playBtn">▶</div>
                </div>
            </div>

            <!-- قسم الأسماء -->
            <div class="names-window">
                <div class="name-card">
                    <div class="card-icon">👤</div>
                    أمير المحمدي
                </div>
                <div class="name-card">
                    <div class="card-icon">👤</div>
                    نياچ ايسر
                </div>
                <div class="name-card">
                    <div class="card-icon">👤</div>
                    محمد قايش
                </div>
                <div class="name-card">
                    <div class="card-icon">👑</div>
                    وأبو مصطفى الكككك
                </div>
                <div class="name-card vip-name">
                    شيييخخخ🔥❤️‍🔥
                </div>
            </div>

        </div>

    </div>

    <!-- ملف الصوت (استبدل song.mp3 باسم أغنيتك) -->
    <audio id="audioPlayer" src="song.mp3" loop></audio>

    <script>
        const enterBtn = document.getElementById('enterBtn');
        const welcomeScreen = document.getElementById('welcomeScreen');
        
        const playBtn = document.getElementById('playBtn');
        const vinyl = document.getElementById('vinyl');
        const tonearm = document.getElementById('tonearm');
        const audio = document.getElementById('audioPlayer');

        // حركة الانتقال من شاشة الترحيب إلى شاشة المشغل
        enterBtn.addEventListener('click', () => {
            welcomeScreen.classList.add('hide');
        });

        // تشغيل وإيقاف الأغنية وحركة المشغل
        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                // تغيير الأيقونة إلى إيقاف
                playBtn.innerHTML = '❚❚';
                // تحريك العصا فوق الأسطوانة
                tonearm.classList.add('playing');
                // بدء دوران الأسطوانة
                vinyl.style.animationPlayState = 'running';
            } else {
                audio.pause();
                // تغيير الأيقونة إلى تشغيل
                playBtn.innerHTML = '▶';
                // إرجاع العصا لمكانها
                tonearm.classList.remove('playing');
                // إيقاف دوران الأسطوانة
                vinyl.style.animationPlayState = 'paused';
            }
        });
    </script>
</body>
</html>
